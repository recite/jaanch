[project]
name = "jaanch"
version = "0.1.0"
description = "Check a draft paper for the errors an expert referee would catch, with Claude Code or Codex subagents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gaurav Sood" }]
keywords = ["peer review", "referee", "research integrity", "claude code", "codex", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jsonschema>=4.26",
    "pyalex>=0.21",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14",
    "requests-hardened>=1.3.0",
    "scipy>=1.17.1",
    "semanticscholar>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/recite/jaanch"
Issues = "https://github.com/recite/jaanch/issues"

[project.scripts]
jaanch = "jaanch.cli:main"

[dependency-groups]
dev = [
    "black>=25.1",
    "flake8>=7.3",
    "isort>=6.0",
    "pep8-naming>=0.15",
    "pytest>=8.4",
    "tomli-w>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 110

[tool.isort]
profile = "black"
line_length = 110

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.csv,*.tsv,*.json,*.geojson,*.graphml,*.ipynb,*.html,*.svg,*.bib,*.bbl,*.lock,*.parquet,*.rda,*.rds,*.RData,*.dta,*.xlsx,*.xml,*.min.js,*.map,*.log,*.aux"
ignore-words-list = "bu,ment"
