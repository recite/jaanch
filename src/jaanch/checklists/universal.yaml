module: universal
title: Universal checks
prefix: UNI
designs: [descriptive, experiment, did, rd, iv, panel, matching, synth, measurement, survey, text, structural, ml, meta]
applies_when: >-
  Every paper with a quantitative empirical analysis. Route it to every such
  paper; individual checks say when they apply.
checks:
  - id: UNI-DATA-01
    register: [reporting.sample_flow]
    pillar: record
    category: data
    requirement: State the analytic sample size and how it was reached from the starting population, including every exclusion and the number of units it removed.
    applies_to: Every paper that reports an estimate from data.
    pass_if: The paper gives the final N for the main analysis and accounts for each exclusion between the starting sample and that N.
    flag_if: The final N is missing, or units drop out between stages without a stated reason or count.
    if_silent: flag
    severity: high
    sources:
      - simmons2011false
      - appelbaum2018jars
  - id: UNI-DATA-02
    register: [reporting.missing_data]
    pillar: record
    category: data
    requirement: Report how much data is missing on the key variables and how missing values were handled.
    applies_to: Every paper whose key outcome, treatment or covariates could have missing values.
    pass_if: The paper reports the extent of missingness for key variables and names the handling (listwise deletion, imputation, weighting, a model-based method).
    flag_if: The paper never mentions missing data, or names a handling method without saying how much data it affects.
    if_silent: flag
    severity: medium
    sources:
      - appelbaum2018jars
      - little2019missing
  - id: UNI-INFER-01
    register: [inference.power_sample_size_justified]
    pillar: statistical
    category: inference
    requirement: Justify the sample size, by a power analysis or another stated rationale.
    applies_to: Every paper whose data collection the authors controlled (experiments, surveys they fielded).
    pass_if: The paper states why it collected this many units, for example a power analysis with its assumed effect size, or a resource constraint stated as such.
    flag_if: The paper gives no reason for its sample size.
    if_silent: flag
    severity: medium
    sources:
      - lakens2022sample
      - appelbaum2018jars
  - id: UNI-INFER-02
    register: [inference.multiplicity_correction]
    pillar: statistical
    category: inference
    requirement: When testing a family of related hypotheses (several outcomes, subgroups or moderators), adjust for multiple comparisons or identify which tests were pre-specified as primary.
    applies_to: Papers that report two or more tests bearing on the same claim.
    pass_if: The paper applies a stated correction (for example Bonferroni, Holm, Benjamini-Hochberg) or designates primary tests in advance and labels the rest exploratory.
    flag_if: The paper draws conclusions from several unadjusted tests without designating any as primary.
    if_silent: flag
    severity: high
    sources:
      - benjamini1995controlling
      - simmons2011false
  - id: UNI-INFER-03
    register: [inference.null_not_no_effect]
    pillar: claim_fit
    category: inference
    requirement: Do not read a statistically non-significant result as evidence of no effect.
    applies_to: Papers that report a non-significant estimate and interpret it.
    pass_if: Non-significant results are described as inconclusive, or the paper supports a null claim with an equivalence test, a bound, or the confidence interval.
    flag_if: The paper says a non-significant estimate shows there is no effect, no difference or no relationship, without such support.
    if_silent: pass
    severity: high
    sources:
      - altman1995absence
      - lakens2018equivalence
  - id: UNI-IDENT-01
    register: [identification.identifying_assumptions_named]
    pillar: internal
    category: identification
    requirement: A causal claim from non-experimental data must name the assumptions that make the estimate causal and give a reason to believe each.
    applies_to: Papers that make a causal claim (effect, impact, causes, leads to) from observational data.
    pass_if: The paper states the identifying assumptions (for example no unmeasured confounding, parallel trends, exclusion) and argues for each.
    flag_if: The paper uses causal language for an observational estimate without stating what makes it causal.
    if_silent: flag
    severity: high
    sources:
      - hernan2018cword
      - "chau2026peer: which quote this check from their universal checklist"
  - id: UNI-ROBUST-01
    register: [identification.unmeasured_confounding_sensitivity]
    pillar: internal
    category: robustness
    requirement: An observational causal estimate must come with an assessment of how sensitive it is to unmeasured confounding.
    applies_to: Papers that report a causal estimate from observational data under a selection-on-observables assumption.
    pass_if: The paper reports a sensitivity analysis (for example an E-value, the Cinelli-Hazlett robustness value, Rosenbaum bounds) or a bound on how strong a confounder would have to be.
    flag_if: No such assessment appears.
    if_silent: flag
    severity: medium
    sources:
      - vanderweele2017sensitivity
      - cinelli2020making
  - id: UNI-CONSTRUCT-01
    register: [measurement.metric_validated, measurement.construct_substitution]
    pillar: construct
    category: data
    requirement: Each key construct's measure must come with validity evidence for this use, and its items must match the construct the claims name.
    applies_to: Every paper whose claims name a construct (attitude, trait, sentiment, wellbeing) measured by a scale, index, coding scheme or proxy.
    pass_if: The paper cites or reports validity evidence (convergent and discriminant associations, prior validation in a comparable population) and the items or coding match the construct's name.
    flag_if: A construct is measured with no validity evidence, or the items measure something narrower or different from what the claims call it.
    if_silent: flag
    severity: high
    sources:
      - cronbach1955construct
      - flake2017construct
      - flake2020measurement
  - id: UNI-EXTERNAL-01
    register: [reasoning.generalization_overreach, inference.sampling_generalizability]
    pillar: external
    category: reporting
    requirement: A claim about a population, setting, time or treatment beyond the one studied must state why the result should carry over.
    applies_to: Papers whose abstract or conclusions generalize beyond the sample (people in general, other countries, other periods, a policy at scale).
    pass_if: The paper names the target population or setting and gives a reason the result transfers (sample representative of it, mechanism argued to hold, replication elsewhere), or limits the claim to the sample.
    flag_if: The claim reaches beyond the units, treatments, outcomes or settings studied with no stated basis.
    if_silent: flag
    severity: medium
    sources:
      - cronbach1982designing
      - "shadish2002experimental: ch. 3"
      - deaton2018understanding
